name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The static musl build is best effort; it must not block the release.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner, so the binary needs only glibc 2.35 (Ubuntu 22.04+).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Fully static binary for any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            experimental: true
          - target: aarch64-apple-darwin
            os: macos-14
          # GitHub has retired the macos-13 (Intel) runner image, so the
          # Intel build is cross-compiled on Apple Silicon instead.
          - target: x86_64-apple-darwin
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Check the binary starts
        if: runner.os == 'Linux' || matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/release/noida --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="noida-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "$name.tar.gz" noida
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: noida-${{ matrix.target }}
          path: |
            noida-${{ matrix.target }}.tar.gz
            noida-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  packages:
    name: Linux packages (deb, rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # Stable file names, so install instructions don't change per release.
          cargo deb --no-build --output dist/noida_amd64.deb
          cargo generate-rpm --output dist/noida.x86_64.rpm
          cd dist
          for f in noida_amd64.deb noida.x86_64.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Check the package installs and runs
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/noida_amd64.deb
          noida --version
          sudo apt-get remove -y noida

      - uses: actions/upload-artifact@v4
        with:
          name: noida-linux-packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
