name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # The static musl build is best effort; it must not block the release.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner, so the binary needs only glibc 2.35 (Ubuntu 22.04+).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Fully static binary for any Linux distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            experimental: true
          - target: aarch64-apple-darwin
            os: macos-14
          # GitHub has retired the macos-13 (Intel) runner image, so the
          # Intel build is cross-compiled on Apple Silicon instead.
          - target: x86_64-apple-darwin
            os: macos-14
          # Linux on ARM: Raspberry Pi, Ampere and Graviton servers, ARM WSL.
          # Built natively on GitHub's arm64 runners, which are free for public
          # repositories but still newer than the rest, so failures don't block.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            experimental: true
          # Windows is newly supported; a failure there must not block a release.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

      - name: Check the binary starts
        if: runner.os == 'Linux' || matrix.target == 'aarch64-apple-darwin'
        run: target/${{ matrix.target }}/release/noida --version

      - name: Check the binary starts (Windows)
        if: runner.os == 'Windows'
        run: target/${{ matrix.target }}/release/noida.exe --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="noida-${{ matrix.target }}"
          # Windows users expect a .zip; everyone else gets the usual tarball.
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="$name.zip"
            (cd "target/${{ matrix.target }}/release" && 7z a -bso0 "$OLDPWD/$archive" noida.exe)
          else
            archive="$name.tar.gz"
            tar -C "target/${{ matrix.target }}/release" -czf "$archive" noida
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: noida-${{ matrix.target }}
          path: |
            noida-${{ matrix.target }}.tar.gz
            noida-${{ matrix.target }}.tar.gz.sha256
            noida-${{ matrix.target }}.zip
            noida-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  packages:
    name: Linux packages (${{ matrix.deb_arch }})
    runs-on: ${{ matrix.os }}
    # arm64 runners are newer than the rest; a failure must not block a release.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: packages-${{ matrix.deb_arch }}

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          # Stable file names, so install instructions don't change per release.
          cargo deb --no-build --output "dist/noida_${{ matrix.deb_arch }}.deb"
          cargo generate-rpm --output "dist/noida.${{ matrix.rpm_arch }}.rpm"
          cd dist
          for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Check the package installs and runs
        run: |
          set -euo pipefail
          sudo apt-get install -y "./dist/noida_${{ matrix.deb_arch }}.deb"
          noida --version
          sudo apt-get remove -y noida

      - uses: actions/upload-artifact@v4
        with:
          name: noida-linux-packages-${{ matrix.deb_arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, packages]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
