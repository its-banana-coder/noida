[package]
name = "noida"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Navigation-Oriented IDE for Developer Agents: a terminal IDE with clickable file references from Claude Code / Codex"
license = "MIT"
repository = "https://github.com/its-banana-coder/noida"
readme = "README.md"
keywords = ["tui", "editor", "ide", "claude", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
anyhow = "1.0.104"
ignore = "0.4.33"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
syntect = "5.3.0"
tree-sitter = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
two-face = "0.5.2"
unicode-width = "0.2.2"
vt100 = "0.16.2"
