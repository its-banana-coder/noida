[package]
name = "noida"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Navigation-Oriented IDE for Developer Agents: a terminal IDE with clickable file references from Claude Code / Codex"
license = "MIT"
repository = "https://github.com/its-banana-coder/noida"
readme = "README.md"
keywords = ["tui", "editor", "ide", "claude", "terminal"]
categories = ["command-line-utilities", "text-editors"]
exclude = ["docs/", ".github/", "scripts/", "TESTING.md"]

# Debian package (cargo-deb)
[package.metadata.deb]
maintainer = "its-banana-coder <noreply@github.com>"
copyright = "2026, NOIDA contributors"
extended-description = """
NOIDA runs Claude Code, Codex or a shell in a real terminal pane next to a
file tree, editor, git review and language-server features. Every file:line
an agent prints is clickable.
"""
section = "devel"
priority = "optional"
assets = [
    ["target/release/noida", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/noida/README.md", "644"],
    ["LICENSE", "usr/share/doc/noida/LICENSE", "644"],
]

# RPM package (cargo-generate-rpm)
[package.metadata.generate-rpm]
license = "MIT"
summary = "Terminal IDE built around Claude Code and Codex"
assets = [
    { source = "target/release/noida", dest = "/usr/bin/noida", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/noida/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/noida/LICENSE", mode = "644", doc = true },
]

[dependencies]
anyhow = "1.0.104"
ignore = "0.4.33"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
streaming-iterator = "0.1.9"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tree-sitter = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"
